name: Release AppImage

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish AppImage
    # 同梱ビューアは Ubuntu 26.04 でビルドされており、linuxdeploy が依存ライブラリ
    # (libicu78 等) を解決できるよう、同じ世代のランナーを使う
    runs-on: ubuntu-26.04

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential \
            cmake \
            curl \
            file \
            git \
            libayatana-appindicator3-dev \
            libdav1d7 \
            libfuse2 \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            libxdo-dev \
            libpng-dev \
            libpng-dev \
            nasm \
            patchelf \
            libdav1d-dev \
            pkg-config \
            wget

      - name: Install Node.js dependencies
        run: npm ci

      - name: Build AppImage
        run: npm run build:release
        env:
          # linuxdeploy 同梱の strip は新しい ELF (.relr.dyn) を扱えず失敗する
          TAURI_BUILD_VERBOSE: "1"
          NO_STRIP: "true"
          # FUSE なしの CI でも linuxdeploy を実行できるようにする
          APPIMAGE_EXTRACT_AND_RUN: "1"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: src-tauri/target/release/bundle/appimage/*.AppImage
