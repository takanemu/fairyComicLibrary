[package]
name = "fairy-comic-library"
version = "0.1.0"
description = "Archive library manager"
authors = ["you"]
edition = "2021"

[lib]
name = "fairy_comic_library_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
image = { version = "=0.25.8", default-features = false, features = ["avif", "avif-native", "bmp", "gif", "jpeg", "png", "webp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["fs", "io-util", "macros", "rt", "sync"] }
sevenz-rust = { version = "0.6.1", default-features = false }
unrar = "0.5.8"
zip = { version = "2.4.2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"

[profile.dev.package."*"]
opt-level = 3
